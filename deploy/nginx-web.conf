server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # 用户端 API：Nuxt runtimeConfig.public.apiBase 默认 /prod-api
    location /prod-api/ {
        proxy_pass http://server:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 上传素材与生成结果文件（/profile/upload、/profile/result）
    location /profile/ {
        proxy_pass http://server:8080/profile/;
        proxy_set_header Host $host;
        expires 7d;
    }

    # 根路径直接进中文表单页
    location = / {
        return 302 /zh/ecommerce-form;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
