# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: /workspace/wimogen-platform/server/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# ===== 映物 VIVID 业务配置 =====
# 全部为开箱即用的本地模拟值；替换成真实服务只需改这里（或用环境变量覆盖），无需改代码。
# 详细见根目录 docs/API.md 与 README.md。
wimo:
  # 邮件通道：留给用户自行配置。mock = 写日志不真发信，验证码通过接口 demoCode 回显（本地默认）
  #           http = POST {to,scene,code,subject,text} 到 http-endpoint
  mail:
    provider: ${WIMO_MAIL_PROVIDER:mock}
    http-endpoint: ${WIMO_MAIL_ENDPOINT:''}
    http-token: ${WIMO_MAIL_TOKEN:''}
  # 生成器：mock = 复制示例封面/视频为结果文件（默认）
  #         remote = POST 任务到模型网关，解析 {"results":["url",...]}
  generator:
    provider: ${WIMO_GENERATOR_PROVIDER:mock}
    remote-url: ${WIMO_GENERATOR_URL:''}
    remote-token: ${WIMO_GENERATOR_TOKEN:''}
    step-ms: 350        # 模拟生成每步耗时（毫秒）
    result-count: 4     # 模拟生成的结果文件数量
  # 本地模拟使用的示例素材目录（容器部署时挂载到该路径）
  mock:
    sample-dir: ${WIMO_SAMPLE_DIR:/workspace/wimogen-platform/web/public/images/preview}
  # ---------------------------------------------------------------
  # 素材存储：local（默认，本地磁盘）/ qiniu（七牛 Kodo）/ r2（Cloudflare R2）/ remote（通用网关）
  # 图片都走对象存储时，把 provider 改成 qiniu 或 r2 并填好凭证即可，无需改代码。
  # ---------------------------------------------------------------
  storage:
    provider: ${WIMO_STORAGE_PROVIDER:local}
    # 通用对象存储网关（provider=remote 时生效）
    remote-endpoint: ${WIMO_STORAGE_REMOTE_ENDPOINT:''}
    remote-token: ${WIMO_STORAGE_REMOTE_TOKEN:''}
    # 七牛云 Kodo
    qiniu:
      access-key: ${QINIU_ACCESS_KEY:''}
      secret-key: ${QINIU_SECRET_KEY:''}
      bucket: ${QINIU_BUCKET:''}
      domain: ${QINIU_DOMAIN:''}          # CDN 外链域名，如 https://cdn.example.com
      upload-url: ${QINIU_UPLOAD_URL:''} # 留空按 region 自动选择
      region: ${QINIU_REGION:z0}         # z0 华东 / z1 华北 / z2 华南 / na0 北美 / as0 东南亚
    # Cloudflare R2（S3 兼容，SigV4 region 固定 auto）
    r2:
      account-id: ${R2_ACCOUNT_ID:''}
      access-key: ${R2_ACCESS_KEY:''}
      secret-key: ${R2_SECRET_KEY:''}
      bucket: ${R2_BUCKET:''}
      public-domain: ${R2_PUBLIC_DOMAIN:''}  # 自定义域或 https://pub-xxx.r2.dev
      endpoint: ${R2_ENDPOINT:''}            # 留空则用 https://<account-id>.r2.cloudflarestorage.com
  # 钻石账户
  diamond:
    register-gift: 100        # 注册赠送体验钻石
    charge-anonymous: false   # 未登录演示用户不扣钻石（true 则匿名也按用户 0 计费）
  # 账号与验证码
  auth:
    code-ttl: 300           # 验证码有效期（秒）
    code-limit-seconds: 60  # 同一邮箱同一场景的发送间隔（秒）
    token-days: 7           # 会员登录令牌有效期（天）
    demo-code: ''           # 留空则随机生成；填写固定值便于自动化测试

